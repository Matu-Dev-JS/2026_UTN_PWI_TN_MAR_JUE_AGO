<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registro de usuarios</h1>
    <form>
        <div>
            <!-- LABEL: Es una descripcion para el usuario de que se espera recibir en este campo -->
            <label for="fullname">Nombre completo:</label>

            <!-- INPUT: Es la etiqueta que usamos para el usuario pueda ingresar informacion -->
            <input 
                type="text" 
                id="fullname" 
                name="fullname" 
                placeholder="Jonh Doe"
                required 
                maxlength="10" 
                minlength="3"
            />
            
        </div>
        <div>
            <label for="mail">Email:</label>
            <input type="email" placeholder="jonhdoe@mail.com" required id="mail" name="email"/>
        </div>
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required/>
        </div>

        <div>
            <span>Seleccione su lenguaje favorito</span>
            <div>
                <label for="html">HTML</label>
                <input type="radio" name="lenguaje_favorito" id="html">
            </div>
            <div>
                <label for="css">CSS</label>
                <input type="radio" name="lenguaje_favorito" id="css">
            </div>
            <div>
                <label for="js">JS</label>
                <input type="radio" name="lenguaje_favorito" id="js">
            </div>
        </div>

        <div>
            <span>Seleccione los lenguajes conocidos</span>
            <div>
                <label for="know_html">HTML</label>
                <input type="checkbox" name="lenguaje_conocido" id="know_html">
            </div>
            <div>
                <label for="know_css">CSS</label>
                <input type="checkbox" name="lenguaje_conocido" id="know_css">
            </div>
            <div>
                <label for="know_js">JS</label>
                <input type="checkbox" name="lenguaje_conocido" id="know_js">
            </div>
        </div>

        <!-- select: Combo de opciones -->
        <div>
            <label for="pais">Elige tu pais de origen:</label>
            <select id="pais" name="pais">
                <option value="AR">Argentina</option>
                <option value="FR">Francia</option>
                <option value="BR">Brasil</option>
                <option value="NO" selected disabled>No seleccionado</option>
            </select>
        </div>

        <div>
            <label for="comentario">Dejanos algun comentario:</label>
            <textarea 
                name="comentario" 
                id="comentario" 
                placeholder="Hola, estoy en HTML"
                rows="10"
                cols="30"
                maxlength="300"
            ></textarea>
        </div>

        <button type="submit">Registrar</button>
    </form>
</body>
</html>
