<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 
    Cada elemento tiene un display por default
        display
            inline: 
                Solo ocupa el ancho de su contenido
                No pueden cambiar sus dimensiones (width, height)
                Si hay espacio disponible, se alinea con otros elementos inline o inline-block
                Solo pueden recibir margen y padding horizontal
                ejemplo: span, a, label

            block:
                Ocupa todo el ancho de bloque
                Pueden cambiar sus dimensiones (width, height)
                No se pueden alinear
                ejemplo: div, h1...h6, p, etiquetas semanticas, form

            inline-block:
                Solo ocupa el ancho de su contenido
                Pueden cambiar sus dimensiones (width, height)
                Si hay espacio disponible, se alinea con otros elementos inline o inline-block
                ejemplo: button, input, select, textarea, img, iframe
    -->

    <span>Hola</span>
    <div>Soy un div</div>
    <button>Click</button>

    <section class="section section-especial">
        <article>1</article>
        <article>2</article>
        <article>3</article>
        <a href="">Hola</a>
    </section>
</body>
</html>
